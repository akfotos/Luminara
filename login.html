<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Luminara</title>
  <meta name="description" content="Log in to your Luminara account and reconnect with your faith-driven creative community.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <!-- ========== HEADER ========== -->
  <header class="header header--auth" id="header">
    <nav class="nav container">
      <a href="index.html" class="nav__logo">Luminara</a>
      <ul class="nav__links">
        <li><a href="explore.html" class="nav__link">Explore</a></li>
        <li><a href="featured.html" class="nav__link">Featured</a></li>
        <li><a href="promise.html" class="nav__link">Our Promise</a></li>
        <li><a href="stories.html" class="nav__link">Stories</a></li>
        <li><a href="about.html" class="nav__link">About</a></li>
        <li><a href="contact.html" class="nav__link">Contact</a></li>
      </ul>
      <div class="nav__actions">
        <a href="join.html" class="btn btn-primary nav__btn">Join Now</a>
      </div>
    </nav>
  </header>

  <!-- ========== AUTH LAYOUT ========== -->
  <main class="auth">
    <div class="auth__split">

      <!-- Left: Decorative Panel -->
      <div class="auth__panel">
        <div class="auth__panel-content">
          <svg class="auth__panel-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1">
            <circle cx="24" cy="24" r="20"/>
            <path d="M24 4v40M4 24h40M8.7 8.7l30.6 30.6M39.3 8.7L8.7 39.3"/>
          </svg>
          <h2>Welcome Back</h2>
          <p>Continue creating with purpose and connecting with your community.</p>
        </div>
      </div>

      <!-- Right: Form -->
      <div class="auth__form-wrapper">
        <div class="auth__form-container">
          <div class="auth__form-header">
            <h1>Log In</h1>
            <p>Enter your credentials to access your account.</p>
          </div>

          <form class="auth__form" id="loginForm">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
              <label for="password">
                Password
                <a href="#" class="form-group__link">Forgot password?</a>
              </label>
              <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <div class="form-group form-group--checkbox">
              <input type="checkbox" id="remember" name="remember">
              <label for="remember">Keep me signed in</label>
            </div>

            <button type="submit" class="btn btn-primary auth__submit">
              Log In
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </form>

          <div class="auth__divider">
            <span>or continue with</span>
          </div>

          <div class="auth__social">
            <button class="auth__social-btn" type="button">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              Google
            </button>
          </div>

          <p class="auth__footer-text">
            Don't have an account? <a href="join.html">Join Luminara</a>
          </p>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
